<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <title>Tally Counter</title>
</head>

<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white w-80 p-8 rounded-2xl shadow-xl text-center">
            <h1 class="text-2xl font-bold mb-6">Tally Counter</h1>

            <h2 id="count" class="text-5xl font-bold mb-6">0</h2>
            <div class="flex gap-3 justify-center">
                <button id="addBtn" class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600">+1</button>
                <button id="resetBtn"  class="bg-red-500 text-white px-6 py-3 rounded-lg hover:bg-red-600">Reset</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
